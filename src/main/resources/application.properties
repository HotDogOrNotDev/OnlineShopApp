spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/onlineShopAppDb}
spring.datasource.username=${DB_USERNAME:onlineShopApp}
spring.datasource.password=${DB_PASSWORD:onlineShopApp}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db.changelog/db.changelog-master.yaml

path.to.adimage.folder=${AD_IMAGE_PATH:./uploads/ads}

server.port=${SERVER_PORT:8080}
